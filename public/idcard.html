<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member ID Card</title><style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:30px}.card{width:760px;max-width:92vw;margin:auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 12px 35px #0001}.head{background:#16244a;color:white;padding:20px;display:flex;gap:15px;align-items:center}.head img{width:72px;height:72px;object-fit:contain;background:white;border-radius:10px}.head h1{margin:0;font-size:25px}.head p{margin:5px 0;color:#dbe4ff}.body{padding:28px}.tag{display:inline-block;background:#f2e0b5;color:#16244a;padding:6px 12px;border-radius:20px;font-weight:800}.row{display:grid;grid-template-columns:160px 1fr;gap:12px;margin:15px 0}.label{color:#667085;font-weight:700}.actions{text-align:center;margin-top:25px}.actions button{border:0;padding:12px 20px;border-radius:9px;background:#16244a;color:#fff;font-weight:700}.note{text-align:center;color:#667085;font-size:13px;margin-top:20px}@media print{body{background:#fff;padding:0}.actions,.note{display:none}.card{box-shadow:none;max-width:none;width:100%}}
</style></head><body><div class="card" id="card"><div class="head"><img src="/logo.jpeg"><div><h1>LIFELINE HUMNITY NGO</h1><p>KAYAKUCHI · ESTD 2025</p></div></div><div class="body"><span class="tag">MEMBER ID CARD</span><div class="row"><div class="label">Member ID</div><div id="id"></div></div><div class="row"><div class="label">Name</div><div id="name"></div></div><div class="row"><div class="label">Phone</div><div id="phone"></div></div><div class="row"><div class="label">Email</div><div id="email"></div></div><div class="row"><div class="label">Joined</div><div id="join"></div></div><div class="actions"><button onclick="print()">Print ID Card</button></div><div class="note">This card is issued for NGO membership identification.</div></div></div><script>fetch('/api/member/idcard').then(r=>r.json()).then(d=>{if(d.error){location.href='/member.html';return}document.getElementById('id').textContent=d.member.id;document.getElementById('name').textContent=d.member.name;document.getElementById('phone').textContent=d.member.phone||'—';document.getElementById('email').textContent=d.member.email||'—';document.getElementById('join').textContent=d.member.joinDate||'—'}).catch(()=>location.href='/member.html')</script></body></html>
