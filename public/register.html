<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Registration | LIFELINE HUMNITY NGO</title><link rel="stylesheet" href="/member.css"></head><body><div class="wrap"><div class="card login-card"><h1>Member Registration</h1><p>Submit your membership application. The NGO admin will review and approve it.</p><form id="f"><label>Full Name<input id="name" required></label><label>Mobile Number<input id="phone" required></label><label>Email<input id="email" type="email"></label><label>Address<input id="address"></label><button>Submit Application</button><div id="msg" class="msg"></div></form><a href="/member.html">Member Login</a> · <a href="/">Website</a></div></div><script>f.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const r=await fetch('/api/member/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,phone:phone.value,email:email.value,address:address.value})});const d=await r.json();msg.textContent=d.message||d.error||'Done';if(r.ok)f.reset()})</script></body></html>
